services:
  # ─── 1. Aplikasi Laravel (PHP + Nginx) ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: absensi_app
    restart: unless-stopped
    ports:
      - "8585:80"          # Akses lewat http://192.168.0.103:8585
    environment:
      APP_NAME: "Sistem Absensi MHC"
      APP_ENV: production
      APP_DEBUG: "true"
      APP_KEY: "base64:nLFw8vkkqzZtbYb+jb9NW7r3xM4PgW1TAEcgc2MFoEg="
      APP_URL: "https://absensi.smkmuthiaharapanclk.com"
      APP_TIMEZONE: Asia/Jakarta
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: id
      NAMA_SEKOLAH: "SMK MUTHIA HARAPAN CICALENGKA"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: absensi_mhc
      DB_USERNAME: absensi_user
      DB_PASSWORD: "AbsensiMHC@2025"

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync

      LOG_CHANNEL: stack
      LOG_LEVEL: debug

      FILESYSTEM_DISK: local
    volumes:
      - app_storage:/var/www/html/storage
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - absensi_net

  # ─── 2. Database MySQL ──────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: absensi_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: absensi_mhc
      MYSQL_USER: absensi_user
      MYSQL_PASSWORD: "AbsensiMHC@2025"
      MYSQL_ROOT_PASSWORD: "RootMHC@2025"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "33306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootMHC@2025"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - absensi_net

  # ─── 3. phpMyAdmin ─────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: absensi_phpmyadmin
    restart: unless-stopped
    ports:
      - "8586:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: "RootMHC@2025"
      UPLOAD_LIMIT: 50M
    depends_on:
      - db
    networks:
      - absensi_net

volumes:
  db_data:
    driver: local
  app_storage:
    driver: local
  app_logs:
    driver: local

networks:
  absensi_net:
    driver: bridge
